name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Get the site files
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Create the Android project
        run: |
          set -e
          APP="$RUNNER_TEMP/app"
          mkdir -p "$APP/www"
          cp index.html icon-512.png "$APP/www/"
          cp ArsenousAudioPlugin.java PlaybackService.java MainActivity.java "$APP/"
          cd "$APP"
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6
          npx cap telemetry off || true
          npx cap init "Arsenous base" com.arsenous.base --web-dir www
          npx cap add android
          python3 - <<'PY'
          import re,json,os,shutil
          p='android/app/src/main/AndroidManifest.xml'
          m=open(p).read()
          perms=''.join('<uses-permission android:name="%s"/>\n    '%x for x in ['android.permission.READ_MEDIA_AUDIO','android.permission.POST_NOTIFICATIONS','android.permission.FOREGROUND_SERVICE','android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK','android.permission.WAKE_LOCK'])
          perms+='<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    '
          m=m.replace('<application',perms+'<application',1)
          m=m.replace('</application>','<service android:name="com.arsenous.base.PlaybackService" android:exported="false" android:foregroundServiceType="mediaPlayback"/>\n    </application>',1)
          open(p,'w').write(m)
          d='android/app/src/main/java/com/arsenous/base'
          os.makedirs(d,exist_ok=True)
          for f in ['ArsenousAudioPlugin.java','PlaybackService.java','MainActivity.java']:
              shutil.copy(f,d+'/'+f)
          c=json.load(open('capacitor.config.json'));c['backgroundColor']='#10141c';json.dump(c,open('capacitor.config.json','w'),indent=2)
          PY
          npx cap sync android
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Set the app icon
        run: |
          set -e
          cd "$APP"
          RES=android/app/src/main/res
          rm -rf "$RES/mipmap-anydpi-v26"
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d="${pair%%:*}"; s="${pair##*:}"
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert www/icon-512.png -resize "${s}x${s}" "$RES/mipmap-$d/$n.png"
            done
          done

      - name: Use a fixed signing key (so updates keep your data)
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore

      - name: Build the APK
        run: |
          set -e
          cd "$APP/android"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/arsenous-base.apk"

      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" arsenous-base.apk --title "Arsenous base APK" --notes "Android APK build" --target "$GITHUB_SHA"
