:root{--f:'Hubot Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--c1:#5b6bd6;--c2:#c2638f;--c3:#3aa6b9;--cb:#10141c;--vh:100vh}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#10141c;color:#fff;font-family:var(--f);font-size:15px;line-height:1.45;overflow:hidden;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
svg{width:100%;height:100%;display:block}
[hidden]{display:none!important}
#app{position:fixed;inset:0;overflow:hidden}
.field{position:absolute;inset:0;z-index:0;background:var(--cb)}
.fl{position:absolute;inset:0;opacity:0;transition:opacity 1s ease}
.fl.on{opacity:1}
.fl i{position:absolute;border-radius:50%;will-change:transform;animation:drift 26s ease-in-out infinite alternate}
.fl i:nth-child(1){width:130vmax;height:130vmax;top:-60vmax;left:-55vmax;background:radial-gradient(closest-side,var(--a1),transparent)}
.fl i:nth-child(2){width:120vmax;height:120vmax;bottom:-55vmax;right:-55vmax;background:radial-gradient(closest-side,var(--a3),transparent);animation-delay:-9s}
.fl i:nth-child(3){width:80vmax;height:80vmax;top:30%;left:20%;background:radial-gradient(closest-side,var(--a2),transparent);opacity:.8;animation-delay:-15s}
@keyframes drift{to{transform:translate3d(6vmax,5vmax,0) scale(1.08)}}
.shade{position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(0,0,0,.10),rgba(0,0,0,.32));pointer-events:none}

.glass{background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);border:1px solid rgba(255,255,255,.30);box-shadow:0 10px 30px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.55),inset 0 0 22px rgba(255,255,255,.06)}
.rb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.rb:active{transform:scale(.88)}.rb svg{width:20px;height:20px}

.page{position:absolute;inset:0;z-index:1;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 200px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.page::-webkit-scrollbar{display:none}
.page.in>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}
.hd h1{margin:0;font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.hd .left{display:flex;align-items:center;gap:10px;min-width:0}
.sub{color:rgba(255,255,255,.62);font-size:14px;margin-top:2px}
.pbtns{display:flex;gap:10px;margin-top:16px}
.pbtns button{flex:1;height:48px;border-radius:99px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.pbtns button:active{transform:scale(.95)}.pbtns svg{width:19px;height:19px}
.chips{display:flex;gap:8px;margin-top:14px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{height:34px;padding:0 15px;border-radius:99px;font-size:13.5px;font-weight:500;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.2);white-space:nowrap;flex:none;transition:background .3s}
.chip.on{background:rgba(255,255,255,.9);color:#10141c;border-color:transparent}
.list{margin-top:10px;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:13px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.10);content-visibility:auto;contain-intrinsic-size:auto 68px}
.row:active{background:rgba(255,255,255,.06)}
.row .rt{flex:1;min-width:0}
.rt b{display:block;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt small{display:block;color:rgba(255,255,255,.6);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dur{color:rgba(255,255,255,.5);font-size:12.5px;font-variant-numeric:tabular-nums}
.mo{width:34px;height:34px;color:rgba(255,255,255,.6);display:grid;place-items:center;border-radius:50%}.mo svg{width:20px;height:20px}
.row.on .rt b{color:#fff}.row.on{background:rgba(255,255,255,.07);margin-inline:-10px;padding-inline:10px;border-radius:16px;border-bottom-color:transparent}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px;margin-inline-end:6px;vertical-align:-1px}.eq i{width:3px;background:#fff;border-radius:2px;animation:eq 1s ease-in-out infinite}.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.75s}
.eq.pz i{animation-play-state:paused}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
.cov{position:relative;overflow:hidden;flex:none;width:var(--s,52px);height:var(--s,52px);border-radius:var(--r,12px);background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.cov.gen::before,.cov.gen::after{content:"";position:absolute;border-radius:50%}
.cov.gen::before{width:46%;height:46%;left:var(--x,50%);top:var(--y,16%);background:var(--g2)}
.cov.gen::after{width:130%;height:70%;left:-15%;top:var(--w,62%);background:var(--g3);border-radius:50%}
.empty{margin-top:60px;text-align:center;color:rgba(255,255,255,.65);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty h3{margin:0;color:#fff;font-size:21px;font-weight:600}
.empty p{margin:0;max-width:30ch}
.big{height:50px;padding:0 28px;border-radius:99px;font-weight:600;font-size:16px;background:rgba(255,255,255,.92);color:#10141c}
.search{display:flex;align-items:center;gap:10px;margin-top:14px;height:50px;padding:0 18px;border-radius:99px}
.search svg{width:20px;height:20px;opacity:.7;flex:none}
.search input{flex:1;background:none;border:0;outline:0;font-size:16px;-webkit-user-select:text;user-select:text;min-width:0}
.search input::placeholder{color:rgba(255,255,255,.5)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.gc{display:flex;flex-direction:column;gap:6px}.gc .cov{width:100%;height:auto;aspect-ratio:1;--r:20px}
.gc b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gc small{color:rgba(255,255,255,.6);margin-top:-6px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow{display:flex;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.10)}
.dhead{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;margin-top:6px}
.dhead .cov{--s:210px;--r:26px;box-shadow:0 24px 50px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.2);margin-bottom:12px}
.dhead h2{margin:0;font-size:24px;font-weight:700}
.back{display:flex;align-items:center;gap:4px;font-weight:600;font-size:16px;margin-top:4px}.back svg{width:22px;height:22px}

.mini{position:fixed;left:16px;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px;border-radius:99px;transition:transform .35s cubic-bezier(.2,.9,.25,1.05),opacity .3s}
.mini.off{transform:translateY(140%);opacity:0;pointer-events:none}
.mini .rt{flex:1;min-width:0;text-align:start}.mini .rt b{font-size:15px}
.mini button{width:36px;height:36px;display:grid;place-items:center}.mini button svg{width:22px;height:22px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:0 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.tabs{display:flex;gap:3px;padding:6px;width:min(440px,100%);border-radius:99px}
.tabs button{flex:1;height:54px;border-radius:99px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:rgba(255,255,255,.65);transition:background .35s,color .35s}
.tabs button svg{width:21px;height:21px}
.tabs .sel{background:rgba(255,255,255,.22);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}

/* now playing */
.now{position:fixed;inset:0;z-index:10;transform:translateY(102%);transition:transform .5s cubic-bezier(.2,.9,.25,1.02);overflow:hidden;display:flex;flex-direction:column;padding:0 24px calc(18px + env(safe-area-inset-bottom,0px))}
.now.open{transform:none}
.now.drag{transition:none}
.now .fieldn{position:absolute;inset:0;z-index:0;background:var(--cb)}
.now>*:not(.fieldn){position:relative;z-index:1}
.grab{width:44px;height:5px;border-radius:9px;background:rgba(255,255,255,.4);margin:calc(10px + env(safe-area-inset-top,0px)) auto 0;flex:none}
.grabzone{padding:0 0 10px;touch-action:none;flex:none}
.artw{flex:1;min-height:0;display:grid;place-items:center;padding:6px 0}
.art{width:min(100%,calc(var(--vh) * .40));aspect-ratio:1;border-radius:28px;box-shadow:0 30px 60px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.16);transition:transform .5s cubic-bezier(.2,.9,.25,1.05);overflow:hidden;background-size:cover;background-position:center}
.art.small{transform:scale(.86)}
.art.gen{position:relative}.art.gen::before,.art.gen::after{content:"";position:absolute;border-radius:50%}
.art.gen::before{width:46%;height:46%;left:var(--x,50%);top:var(--y,16%);background:var(--g2)}
.art.gen::after{width:130%;height:70%;left:-15%;top:var(--w,62%);background:var(--g3)}
.qpanel{width:100%;height:100%;overflow-y:auto;scrollbar-width:none;border-radius:24px;padding:6px 12px}.qpanel::-webkit-scrollbar{display:none}
.qh{font-size:13px;font-weight:600;color:rgba(255,255,255,.65);margin:8px 2px 2px;text-transform:uppercase;letter-spacing:.06em}
.meta{display:flex;align-items:center;gap:12px;margin-top:18px;flex:none}
.meta .tt{flex:1;min-width:0}
.meta h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta p{margin:0;font-size:20px;color:rgba(255,255,255,.62);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heart.on{color:#ff6f8f}.heart.on svg path{fill:currentColor}
.seek{margin-top:18px;flex:none;touch-action:none}
.bar{position:relative;height:6px;border-radius:9px;background:rgba(255,255,255,.28);overflow:hidden;transition:height .2s}
.bar i{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.95);border-radius:9px;width:0}
.seek.drag .bar,.vol .bar.drag{height:12px}
.seekhit{padding:10px 0;margin:-10px 0}
.tm{display:flex;justify-content:space-between;font-size:12.5px;color:rgba(255,255,255,.6);margin-top:6px;font-weight:500;font-variant-numeric:tabular-nums}
.ctl{display:flex;justify-content:center;align-items:center;gap:52px;margin-top:14px;flex:none}
.ctl button{width:48px;height:48px;display:grid;place-items:center;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.ctl button:active{transform:scale(.86)}
.ctl .pp{width:76px;height:76px}.ctl svg{width:100%;height:100%}
.vol{display:flex;align-items:center;gap:12px;margin-top:20px;color:rgba(255,255,255,.62);flex:none}
.vol .ic{width:20px;height:20px;flex:none}.vol .bar{flex:1}.vol .bar i{background:rgba(255,255,255,.85)}.vol .hit{flex:1;padding:10px 0;margin:-10px 0;touch-action:none}
.bot{display:flex;justify-content:space-around;align-items:center;margin-top:12px;color:rgba(255,255,255,.62);flex:none}
.bot button{width:62px;height:46px;display:grid;place-items:center;border-radius:99px;position:relative;transition:background .3s}
.bot button svg{width:23px;height:23px}
.bot .on{color:#fff;background:rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.bot .one::after{content:"1";position:absolute;right:12px;top:6px;font-size:10px;font-weight:700}

/* sheets */
.sw{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.38);animation:fade .3s}
.sheet{position:relative;width:min(560px,100%);max-height:86%;overflow:auto;border-radius:32px 32px 0 0;background:color-mix(in srgb,var(--cb) 82%,#fff 6%);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border:1px solid rgba(255,255,255,.22);border-bottom:0;padding:0 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .4s cubic-bezier(.2,.9,.25,1.05);scrollbar-width:none}
.sheet.closing{transition:transform .26s ease-in,opacity .26s;transform:translateY(100%);opacity:0}
.sheet .g{width:42px;height:5px;border-radius:9px;background:rgba(255,255,255,.35);margin:10px auto 14px}
.sheet h3{margin:0 0 10px;font-size:19px;font-weight:700}
.sheet .sh{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:4px}
.mi{display:flex;align-items:center;gap:14px;width:100%;text-align:start;padding:13px 4px;font-size:16.5px;font-weight:500;border-bottom:1px solid rgba(255,255,255,.08)}
.mi:last-child{border-bottom:0}.mi svg{width:22px;height:22px;opacity:.85;flex:none}.mi.red{color:#ff8a80}
.mi small{margin-inline-start:auto;color:rgba(255,255,255,.55)}
.inp{width:100%;height:50px;border-radius:18px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.10);padding:0 16px;outline:0;font-size:16px;-webkit-user-select:text;user-select:text}
.inp:focus{border-color:rgba(255,255,255,.7)}
.frm{display:flex;flex-direction:column;gap:12px}
@keyframes up{from{transform:translateY(60px);opacity:0}}@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:0;right:0;top:calc(14px + env(safe-area-inset-top,0px));display:flex;justify-content:center;z-index:40;pointer-events:none}
.toast span{padding:10px 18px;border-radius:99px;background:rgba(255,255,255,.92);color:#10141c;font-weight:600;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:drop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes drop{from{opacity:0;transform:translateY(-14px) scale(.95)}}
.ob{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:30px}
.ob .logo{width:120px;height:120px;border-radius:34px;display:grid;place-items:center}.ob .logo svg{width:54px;height:54px}
.ob h1{margin:8px 0 0;font-size:34px;font-weight:700;letter-spacing:-.02em}.ob p{margin:0;color:rgba(255,255,255,.7);max-width:30ch}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;animation:sp .8s linear infinite;display:inline-block}@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app">
  <div class="field" id="field"><div class="fl on" id="fl0"><i></i><i></i><i></i></div><div class="fl" id="fl1"><i></i><i></i><i></i></div></div>
  <div class="shade"></div>
  <main class="page in" id="page"></main>
  <div class="mini glass off" id="mini"></div>
  <div class="dock"><nav class="tabs glass" id="tabs"></nav></div>
  <section class="now" id="now"></section>
  <div class="sw" id="sw" hidden><div class="scrim" id="scrim"></div><div class="sheet" id="sheet"></div></div>
  <div class="toast" id="toast" aria-live="polite"></div>
  <div class="ob" id="ob" hidden></div>
</div>
<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='arsenous-base-v1';
let S={};try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
S=Object.assign({playlists:[],favs:[],sort:'title',shuffle:false,repeat:0,last:null,songs:[]},S);
let saveT=null;const save=()=>{clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},300)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- native bridge ---------- */
const C=window.Capacitor,reg=n=>{try{return C&&(C.registerPlugin?C.registerPlugin(n):C.Plugins&&C.Plugins[n])}catch(e){return C&&C.Plugins&&C.Plugins[n]}},A=reg('ArsenousAudio');
const NATIVE=!!(C&&C.isNativePlatform&&C.isNativePlatform()&&A);
const call=async(m,a)=>{try{return await A[m](a||{})}catch(e){return null}};

/* ---------- icons ---------- */
const I={
play:'<path d="M7 4.5v15l13-7.5z" fill="currentColor" stroke="none"/>',pause:'<rect x="6" y="4.5" width="4.4" height="15" rx="1.4" fill="currentColor" stroke="none"/><rect x="13.6" y="4.5" width="4.4" height="15" rx="1.4" fill="currentColor" stroke="none"/>',
next:'<path d="M4 5.5v13l9-6.5zM12 5.5v13l9-6.5z" fill="currentColor" stroke="none"/>',prev:'<path d="M20 5.5v13l-9-6.5zM12 5.5v13l-9-6.5z" fill="currentColor" stroke="none"/>',
more:'<circle cx="6" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="18" cy="12" r="1.5" fill="currentColor" stroke="none"/>',
heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.4A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
que:'<path d="M4 7h11M4 12h11M4 17h7M18 10v8M15.5 15.5l2.5 2.5 2.5-2.5"/>',
spl:'<path d="M4 10v4h3l4 3V7l-4 3z" fill="currentColor"/>',sph:'<path d="M4 10v4h3l4 3V7l-4 3z" fill="currentColor"/><path d="M14.5 9a4 4 0 0 1 0 6M17 6.5a8 8 0 0 1 0 11"/>',
note:'<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>',disc:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/>',
list:'<path d="M9 7h10M9 12h10M9 17h6"/><circle cx="5" cy="7" r=".6" fill="currentColor"/><circle cx="5" cy="12" r=".6" fill="currentColor"/><circle cx="5" cy="17" r=".6" fill="currentColor"/>',
search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/>',shuf:'<path d="M4 7h3c5 0 5 10 10 10h3M4 17h3c1.6 0 2.7-.9 3.6-2M13.4 9C14.3 8 15.4 7 17 7h3M17.5 4.5L20 7l-2.5 2.5M17.5 14.5L20 17l-2.5 2.5"/>',
rep:'<path d="M5 11V9a3 3 0 0 1 3-3h11M16 3l3 3-3 3M19 13v2a3 3 0 0 1-3 3H5M8 21l-3-3 3-3"/>',
plus:'<path d="M12 5v14M5 12h14"/>',chev:'<path d="M15 6l-6 6 6 6"/>',down:'<path d="M6 9l6 6 6-6"/>',gear:'<circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/>',
trash:'<path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/>',nextup:'<path d="M5 6h9M5 11h9M5 16h5M17 8v8M14.5 13.5L17 16l2.5-2.5"/>',pl:'<path d="M4 7h11M4 12h11M4 17h6M16 14v6M13 17h6"/>',star:'<path d="M12 3.8l2.4 5 5.4.7-4 3.8 1 5.4L12 16l-4.8 2.7 1-5.4-4-3.8 5.4-.7z"/>',refresh:'<path d="M4.5 12a7.5 7.5 0 0 1 13-5l2 2M19.5 4.5v4.5h-4.5M19.5 12a7.5 7.5 0 0 1-13 5l-2-2M4.5 19.5V15h4.5"/>'};
const ic=(n,sw)=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(sw||2)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+I[n]+'</svg>';

/* ---------- songs ---------- */
let songs=[],byId=new Map();
function setSongs(l){songs=l;byId=new Map(l.map(s=>[s.id,s]))}
setSongs(S.songs||[]);
const mmss=ms=>{const t=Math.max(0,Math.round(ms/1000));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
const mini1=s=>({id:s.id,title:s.title,artist:s.artist,album:s.album,dur:s.dur});
function sortedSongs(){
  const l=songs.slice(),cmp=(a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true,sensitivity:'base'});
  if(S.sort==='artist')l.sort((a,b)=>cmp(a.artist,b.artist)||cmp(a.title,b.title));
  else if(S.sort==='added')l.sort((a,b)=>(b.added||0)-(a.added||0));
  else l.sort((a,b)=>cmp(a.title,b.title));
  return l;
}

/* ---------- covers + palette ---------- */
const hash=s=>{let h=2166136261;s=String(s);for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
const hsl=(h,s,l)=>'hsl('+Math.round(((h%360)+360)%360)+' '+s+'% '+l+'%)';
function genPal(song){
  const h=hash((song.album||'')+'|'+(song.artist||'')+'|'+song.title)%360;
  return{a:hsl(h,66,58),b:hsl(h+42,70,62),c:hsl(h-38,60,52),d:hsl(h,42,12)};
}
function genStyle(song){
  const k=hash((song.album||'')+song.title),p=genPal(song);
  return '--g1:'+p.d+';--g2:'+p.b+';--g3:'+p.c+';--x:'+(10+(k%50))+'%;--y:'+(10+((k>>3)%24))+'%;--w:'+(52+((k>>5)%22))+'%;background:linear-gradient(150deg,'+p.a+','+p.d+')';
}
const ART={},BIG={},PALS={},wantQ=[];let artBusy=0;
const artKey=s=>s.album&&s.album!=='Unknown album'?'al:'+s.album+'|'+s.artist:'id:'+s.id;
function covHTML(s,size,r,extra){
  const key=artKey(s),has=ART[key];
  return '<div class="cov'+(has?'':' gen')+'" data-cv="'+esc(key)+'" data-id="'+s.id+'" style="--s:'+size+'px;--r:'+(r||12)+'px;'+(has?'background-image:url('+has+')':genStyle(s))+(extra||'')+'"></div>';
}
function wantArt(s){
  const key=artKey(s);if(ART[key]!==undefined||wantQ.some(x=>x.key===key))return;
  wantQ.push({key,id:s.id});pumpArt();
}
function pumpArt(){
  while(artBusy<2&&wantQ.length){
    const w=wantQ.shift();artBusy++;
    call('getArt',{id:w.id,size:160}).then(r=>{
      const d=r&&r.data;ART[w.key]=d?'data:image/jpeg;base64,'+d:'';
      if(d)$$('[data-cv="'+CSS.escape(w.key)+'"]').forEach(e=>{e.classList.remove('gen');e.style.backgroundImage='url('+ART[w.key]+')'});
    }).finally(()=>{artBusy--;pumpArt()});
  }
}
const io='IntersectionObserver' in window?new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){const s=byId.get(+e.target.dataset.id);if(s)wantArt(s);io.unobserve(e.target)}})},{rootMargin:'300px'}):null;
function observeCovers(root){$$('.cov[data-id]',root).forEach(e=>{if(e.classList.contains('gen')){if(io)io.observe(e);else{const s=byId.get(+e.dataset.id);if(s)wantArt(s)}}})}

/* palette extraction */
function extract(url){
  return new Promise(res=>{
    const im=new Image();im.onload=()=>{
      try{
        const n=28,c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d');x.drawImage(im,0,0,n,n);const d=x.getImageData(0,0,n,n).data;
        const bins=Array.from({length:12},()=>({w:0,r:0,g:0,b:0}));
        for(let i=0;i<d.length;i+=4){
          const r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,sat=mx===mn?0:(mx-mn)/(1-Math.abs(2*l-1));
          let h=0;if(mx!==mn){h=mx===r?((g-b)/(mx-mn))%6:mx===g?(b-r)/(mx-mn)+2:(r-g)/(mx-mn)+4;h*=60;if(h<0)h+=360}
          const w=sat*sat*(0.25+Math.min(l,1-l))+0.002,bi=bins[Math.floor(h/30)%12];bi.w+=w;bi.r+=d[i]*w;bi.g+=d[i+1]*w;bi.b+=d[i+2]*w;
        }
        const top=bins.map((b,i)=>({...b,i})).sort((a,b)=>b.w-a.w).filter(b=>b.w>0.02);
        const picks=[];top.forEach(b=>{if(picks.length<3&&picks.every(p=>{const dd=Math.abs(p.i-b.i);return Math.min(dd,12-dd)>=2}))picks.push(b)});
        if(!picks.length)return res(null);
        const col=b=>{const r=b.r/b.w,g=b.g/b.w,bl=b.b/b.w;return toHSL(r,g,bl)};
        const cs=picks.map(col);while(cs.length<3)cs.push({h:cs[0].h+30*cs.length,s:cs[0].s,l:cs[0].l});
        const fix=c=>hsl(c.h,Math.round(Math.max(45,Math.min(88,c.s*100*1.1))),Math.round(Math.max(40,Math.min(62,c.l*100+6))));
        res({a:fix(cs[0]),b:fix(cs[1]),c:fix(cs[2]),d:hsl(cs[0].h,Math.round(Math.min(50,cs[0].s*70)),11)});
      }catch(e){res(null)}
    };im.onerror=()=>res(null);im.src=url;
  });
}
function toHSL(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;
  if(mx!==mn){s=(mx-mn)/(1-Math.abs(2*l-1));h=mx===r?((g-b)/(mx-mn))%6:mx===g?(b-r)/(mx-mn)+2:(r-g)/(mx-mn)+4;h*=60;if(h<0)h+=360}return{h,s,l}}
let layer=0,curPalKey='';
function applyPal(p){
  const f=$('#fl'+(1-layer)),o=$('#fl'+layer);
  f.style.setProperty('--a1',p.a);f.style.setProperty('--a2',p.b);f.style.setProperty('--a3',p.c);
  document.documentElement.style.setProperty('--cb',p.d);
  f.classList.add('on');o.classList.remove('on');layer=1-layer;
  const now=$('#now');if(now){now.style.setProperty('--cb',p.d)}
  document.documentElement.style.setProperty('--c1',p.a);
  call('setBars',{color:toHex(p.d)});
}
function toHex(c){const m=/hsl\((\d+) (\d+)% (\d+)%\)/.exec(c);if(!m)return '#10141c';const h=+m[1],s=+m[2]/100,l=+m[3]/100,k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>Math.round(255*(l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)))));return '#'+[f(0),f(8),f(4)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function paletteFor(s){
  if(!s)return;const key=artKey(s);if(key===curPalKey)return;curPalKey=key;
  let p=PALS[key];
  if(!p){
    let url=ART[key];
    if(url===undefined){const r=await call('getArt',{id:s.id,size:160});url=r&&r.data?'data:image/jpeg;base64,'+r.data:'';ART[key]=url}
    p=url?await extract(url):null;if(!p)p=genPal(s);PALS[key]=p;
  }
  if(curPalKey===key)applyPal(p);
}
async function bigArt(s){
  const key=artKey(s);if(BIG[key])return BIG[key];
  const r=await call('getArt',{id:s.id,size:700});const url=r&&r.data?'data:image/jpeg;base64,'+r.data:'';BIG[key]=url;return url;
}

/* ---------- toast + sheets ---------- */
function toast(m){const e=$('#toast');e.innerHTML='<span>'+esc(m)+'</span>';clearTimeout(toast.h);toast.h=setTimeout(()=>e.innerHTML='',2200)}
let sheetOpen=false;
function openSheet(html,bind){
  const w=$('#sw'),sh=$('#sheet');sh.className='sheet';sh.innerHTML='<div class="g"></div>'+html;w.hidden=false;sheetOpen=true;if(bind)bind(sh);
}
function closeSheet(){
  const w=$('#sw'),sh=$('#sheet');if(w.hidden)return;sh.classList.add('closing');sheetOpen=false;
  setTimeout(()=>{w.hidden=true;sh.innerHTML='';sh.className='sheet'},240);
}
$('#scrim').addEventListener('click',closeSheet);

/* ---------- player state ---------- */
const P={has:false,playing:false,id:0,pos:0,dur:0,index:0,len:0};
let Q={ids:[],index:0},showQ=false,nowOpen=false,seeking=false,lastId=0;
function listOf(ids){return ids.map(i=>byId.get(i)).filter(Boolean)}
async function playSongs(list,index,forceShuffle){
  if(!list.length)return;
  if(forceShuffle!==undefined){S.shuffle=!!forceShuffle}
  await call('requestNotif');
  const r=await call('setQueue',{tracks:list.map(mini1),index:Math.max(0,index),play:true,shuffle:S.shuffle,repeat:S.repeat,startPos:0});
  S.last={ids:list.map(s=>s.id),index:Math.max(0,index),pos:0};save();
  poll();setTimeout(poll,350);
}
async function resumeLast(){
  const l=S.last;if(!l||!l.ids.length)return false;
  const list=listOf(l.ids);if(!list.length)return false;
  await call('requestNotif');
  await call('setQueue',{tracks:list.map(mini1),index:Math.min(l.index||0,list.length-1),play:true,shuffle:S.shuffle,repeat:S.repeat,startPos:l.pos||0});
  poll();setTimeout(poll,350);return true;
}
async function cmd(c,v){await call('command',{cmd:c,value:v||0});poll()}
async function toggle(){
  if(!P.has){const ok=await resumeLast();if(!ok&&songs.length)playSongs(sortedSongs(),0);return}
  cmd('toggle');
}
async function poll(){
  if(!NATIVE)return;
  const s=await call('getState');if(!s)return;
  const changed=s.id!==P.id;
  Object.assign(P,s);
  if(changed){lastId=s.id;onTrack()}
  paintProgress();paintPlayState();
  if(P.has&&(P.pos%5===0||changed)){}

function bindSeek(){
  const el=$('#seek'),hit=$('.seekhit',el);let id=null;
  const frac=e=>{const r=$('.bar',el).getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))};
  hit.addEventListener('pointerdown',e=>{if(!P.dur)return;seeking=true;id=e.pointerId;hit.setPointerCapture(id);el.classList.add('drag');upd(e)});
  const upd=e=>{const f=frac(e);$('.bar i',el).style.width=(f*100)+'%';$('#tmA').textContent=mmss(f*P.dur);$('#tmB').textContent='-'+mmss((1-f)*P.dur)};

}
function bindVol(){
  const hit=$('#volhit'),bar=$('#volbar');let on=false,t=0;
  const upd=e=>{const r=bar.getBoundingClientRect(),f=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));$('i',bar).style.width=(f*100)+'%';const n=Date.now();if(n-t>80){t=n;call('volume',{set:f})}return f};
  hit.addEventListener('pointerdown',e=>{on=true;hit.setPointerCapture(e.pointerId);bar.classList.add('drag');upd(e)});
  hit.addEventListener('pointermove',e=>{if(on)upd(e)});
  const end=e=>{if(!on)return;on=false;bar.classList.remove('drag');call('volume',{set:upd(e)})};

}
function bindDragDown(){
  const z=$('#gz'),n=$('#now');let y0=null,dy=0;
  z.addEventListener('pointerdown',e=>{y0=e.clientY;dy=0;z.setPointerCapture(e.pointerId);n.classList.add('drag')});

}

async function scanLib(manual){
  if(!NATIVE){showOnboard('This app plays music from your Android phone. Install the APK to use it.','OK');return}
  const acc=await call('requestAccess');
  if(!acc||!acc.granted){showOnboard('Allow access to your music so Arsenous base can find your songs. Nothing is copied or uploaded.','Allow access');return}
  const r=await call('scan');
  $('#ob').hidden=true;
  if(!r||!Array.isArray(r.songs)){if(manual)toast('Could not read your music');return}
  setSongs(r.songs);S.songs=r.songs;
  S.favs=S.favs.filter(i=>byId.has(i));S.playlists.forEach(p=>p.ids=p.ids.filter(i=>byId.has(i)));
  save();render();renderMini();if(manual)toast(r.songs.length+' songs found');

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const t=e.target;
  const tb=t.closest('[data-tab]');if(tb){const k=tb.dataset.tab;if(k!==tab||stack.length){tab=k;stack=[];render(true)}return}
  const mn=t.closest('[data-menu]');if(mn){songMenu(+mn.dataset.menu,stack.length&&stack[stack.length-1].type==='pl'?stack[stack.length-1]:null);return}
  const so=t.closest('[data-sort]');if(so){S.sort=so.dataset.sort;save();viewSongs();return}
  const al=t.closest('[data-album]');if(al){stack.push({type:'album',key:+al.dataset.album});render(true);return}
  const pl=t.closest('[data-pl]');if(pl){stack.push({type:'pl',key:pl.dataset.pl});render(true);return}
  const qi=t.closest('[data-qi]');if(qi){cmd('jump',+qi.dataset.qi);return}
  const row=t.closest('.row[data-i]');if(row){const i=+row.dataset.i;playSongs(curList,i);return}
  const a=t.closest('[data-a]');if(!a)return;
  switch(a.dataset.a){
    case 'open':openNow();break;
    case 'toggle':toggle();break;
    case 'next':cmd('next');break;
    case 'prev':cmd('prev');break;
    case 'fav':{const s=curSong();if(s)toggleFav(s.id);break}
    case 'songmenu':{const s=curSong();if(s)songMenu(s.id,null);break}
    case 'shuf':S.shuffle=!S.shuffle;save();cmd('shuffle',S.shuffle?1:0);paintToggles();toast(S.shuffle?'Shuffle on':'Shuffle off');break;
    case 'rep':S.repeat=(S.repeat+1)%3;save();cmd('repeat',S.repeat);paintToggles();toast(['Repeat off','Repeat all','Repeat one'][S.repeat]);break;
    case 'queue':showQ=!showQ;if(showQ){const q=await call('getQueue');if(q)Q={ids:q.ids||[],index:q.index||0};renderQueue()}else{const s=curSong();$('#artw').innerHTML='';renderNowMeta()}paintToggles();break;
    case 'pplay':playSongs(curList,0,false);break;
    case 'pshuf':playSongs(curList,Math.floor(Math.random()*curList.length),true);break;
    case 'settings':settingsSheet();break;
    case 'rescan':scanLib(true);break;
    case 'newpl':nameSheet('New playlist','',n=>{S.playlists.push({id:uid(),name:n,ids:[]});save();viewPlaylists()});break;
    case 'back':stack.pop();render();break;
    case 'renamepl':{const p=S.playlists.find(x=>x.id===stack[stack.length-1].key);if(p)nameSheet('Rename playlist',p.name,n=>{p.name=n;save();render()});break}
    case 'delpl':{const k=stack[stack.length-1].key;openSheet('<h3>Delete this playlist?</h3><button class="mi red" data-x="1">'+ic('trash')+'Delete</button><button class="mi" data-x="0">Cancel</button>',root=>root.addEventListener('click',ev=>{const b=ev.target.closest('[data-x]');if(!b)return;if(b.dataset.x==='1'){S.playlists=S.playlists.filter(p=>p.id!==k);save();stack=[];render();toast('Playlist deleted')}closeSheet()}));break}
  }
});
/* hardware back (Android) */
try{const App=reg('App');if(App&&App.addListener)App.addListener('backButton',()=>{
  if(sheetOpen)closeSheet();else if(nowOpen)closeNow();else if(stack.length){stack.pop();render()}else if(tab!=='songs'){tab='songs';render(true)}else if(App.minimizeApp)App.minimizeApp()
})}catch(e){}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
setInterval(()=>{if(!document.hidden)poll()},500);

/* ---------- boot ---------- */
(async function(){
  buildNow();
  const s0=S.last&&S.songs.length?byId.get(S.last.ids[S.last.index]):null;
  const gp=s0?genPal(s0):{a:'#5b6bd6',b:'#c2638f',c:'#3aa6b9',d:'#10141c'};applyPal(gp);
  render(true);renderMini();
  if(NATIVE){await poll();if(P.has)onTrack()}
  scanLib(false);
})();
})();
</script>
</body>
